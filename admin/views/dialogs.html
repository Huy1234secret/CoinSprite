<dialog id="confirmDialog" class="dialog">
  <form method="dialog">
    <span class="dialog-icon">!</span>
    <h2 id="dialogTitle">Confirm action</h2>
    <p id="dialogCopy"></p>
    <label id="dialogInputWrap" hidden>
Reason
      <textarea id="dialogInput" maxlength="500" rows="4"></textarea>
    </label>
    <div>
      <button class="button ghost" value="cancel">Cancel</button>
      <button class="button danger" id="dialogConfirm" value="confirm">Confirm</button>
    </div>
  </form>
</dialog>
<dialog id="templatePickerDialog" class="dialog template-picker-dialog">
  <form method="dialog">
    <span class="dialog-icon">📋</span>
    <h2>Use a message template</h2>
    <p>Applying a template copies its current message and layout as a snapshot.</p>
    <label class="template-picker-search">
Search templates
      <input id="templatePickerSearch" type="search" maxlength="80" placeholder="Search by name">
    </label>
    <div id="templatePickerList" class="template-picker-list"></div>
    <div>
      <button class="button ghost" value="cancel">Cancel</button>
    </div>
  </form>
</dialog>
<dialog id="templateActionDialog" class="dialog template-action-dialog" aria-labelledby="templateActionTitle">
  <form method="dialog">
    <span class="dialog-icon" aria-hidden="true">&#x2699;</span>
    <h2 id="templateActionTitle">Configure action</h2>
    <p id="templateActionCopy">Choose the target used when this control is selected.</p>
    <label class="template-action-target">
      <span id="templateActionTargetLabel">Target</span>
      <select id="templateActionTarget" aria-describedby="templateActionHelp"></select>
      <small id="templateActionHelp"></small>
    </label>
    <div>
      <button class="button ghost" value="cancel">Cancel</button>
      <button class="button primary" id="templateActionSave" type="button">Save action</button>
    </div>
  </form>
</dialog>
<dialog id="emojiPickerDialog" class="emoji-picker-dialog" aria-labelledby="emojiPickerTitle">
  <section>
    <header>
      <div>
        <span class="dialog-icon" aria-hidden="true">&#x1F600;</span>
        <div>
          <h2 id="emojiPickerTitle">Choose an emoji</h2>
          <p>Insert into the active message or interaction.</p>
        </div>
      </div>
      <button type="button" id="emojiPickerClose" aria-label="Close emoji picker">❌</button>
    </header>
    <label class="emoji-picker-search">
      <span class="sr-only">Search emojis</span>
      <input id="emojiPickerSearch" type="search" maxlength="80" placeholder="Search by emoji name" autocomplete="off">
    </label>
    <div class="emoji-picker-tabs" role="tablist" aria-label="Emoji source">
      <button class="active" type="button" role="tab" aria-selected="true" data-emoji-section="bot">Bot Emojis</button>
      <button type="button" role="tab" aria-selected="false" data-emoji-section="group">Group Emojis</button>
      <button type="button" role="tab" aria-selected="false" data-emoji-section="default">Default Emojis</button>
    </div>
    <div id="emojiPickerStatus" class="emoji-picker-status" role="status"></div>
    <div class="emoji-picker-catalog">
      <nav id="emojiPickerCategories" class="emoji-picker-categories" aria-label="Default emoji categories" hidden></nav>
      <div id="emojiPickerGrid" class="emoji-picker-grid" role="grid" aria-label="Emoji results"></div>
    </div>
  </section>
</dialog>
