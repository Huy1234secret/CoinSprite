<section class="view" id="ownerView" data-view-panel="owner" hidden>
  <header class="dashboard-hero compact-hero owner-hero">
    <div class="hero-copy">
      <span class="eyebrow">🛠️ FLEET CONTROL · OWNER ONLY</span>
      <h1>Operate the bot, not just the settings.</h1>
      <p>Watch live health, govern server access, and trace runtime activity from one protected view.</p>
    </div>
    <button class="button ghost" id="ownerRefresh" type="button">↻ Refresh snapshot</button>
  </header>
  <div id="ownerOverview" class="owner-overview"></div>
  <p id="ownerLiveStatus" class="microcopy" role="status" aria-live="polite"></p>
  <section class="console-panel operation-block">
    <div class="console-head">
      <div>
        <span class="console-light"></span>
        <strong>Live runtime stream</strong>
      </div>
      <div>
        <button class="text-button" id="consoleClear" type="button">Clear</button>
        <button class="text-button" id="consoleToggle" type="button">Pause</button>
      </div>
    </div>
    <div class="console-output" id="consoleOutput" tabindex="0">
      <p class="console-empty">Waiting for bot activity…</p>
    </div>
  </section>
</section>
